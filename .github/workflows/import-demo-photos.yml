name: Import images into demo repository (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-demo-photos.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and update site images
        run: python3 scripts/import_demo_photos.py
      - name: Commit downloaded photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ *.html README.md
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Pexels photos locally in website"
            git push origin HEAD:main
          fi
